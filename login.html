<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in &middot; DGCA Exam Bank &middot; Flight Flare Aviation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/academy.css">
<link rel="icon" href="logo1.png" type="image/png">

<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .auth-wrap{ width:100%; max-width:400px; }
  .auth-brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
  .auth-brand img{ width:34px; height:34px; border-radius:8px; }
  .auth-brand strong{ font-family:var(--font-display); letter-spacing:.3px; }
  .auth-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px 26px; }
  .auth-tabs{ display:flex; background:var(--bg-elev); border-radius:10px; padding:4px; margin-bottom:20px; }
  .auth-tab{ flex:1; text-align:center; padding:9px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-muted); }
  .auth-tab.active{ background:var(--panel-hover); color:var(--text); }
  .auth-field{ margin-bottom:14px; }
  .auth-field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
  .auth-field input{ width:100%; box-sizing:border-box; padding:11px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text); font-family:var(--font-body); font-size:14px; }
  .auth-field input:focus{ outline:none; border-color:var(--cyan); }
  .auth-error{ font-size:12.5px; color:var(--danger); margin:-4px 0 14px; display:none; }
  .auth-submit{ width:100%; padding:12px; border:none; border-radius:8px; background:var(--cyan); color:#04231f; font-weight:700; font-size:14px; cursor:pointer; font-family:var(--font-body); }
  .auth-submit:disabled{ opacity:.6; cursor:default; }
  .auth-back{ display:block; text-align:center; margin-top:16px; font-size:12.5px; color:var(--text-muted); text-decoration:none; }
  .auth-back:hover{ color:var(--text); }
</style>
</head>
<body>

<div class="auth-wrap">
  <a href="index.html" class="auth-brand" style="text-decoration:none;">
    <img src="logo1.png" alt="Flight Flare Aviation">
    <strong style="color:var(--text);">FLIGHT FLARE AVIATION</strong>
  </a>

  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">Log in</div>
      <div class="auth-tab" data-tab="signup">Create account</div>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="authForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
    </form>

    <a href="index.html" class="auth-back">&larr; Back to the exam bank</a>
  </div>
</div>

<script>
(function(){
  const tabs = document.querySelectorAll(".auth-tab");
  const submitBtn = document.getElementById("authSubmit");
  const pwField = document.getElementById("password");
  const errBox = document.getElementById("authError");
  let mode = "login";

  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    mode = t.dataset.tab;
    submitBtn.textContent = mode === "login" ? "Log in" : "Create account";
    pwField.setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");
    errBox.style.display = "none";
  }));

  document.getElementById("authForm").addEventListener("submit", async function(e){
    e.preventDefault();
    errBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`/api/${mode === "login" ? "login" : "signup"}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get("next") || "index.html";
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = mode === "login" ? "Log in" : "Create account";
    }
  });
})();
</script>

</body>
</html>
